<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  #chart-container { width: 100%; }
</style>
</head>
<body>
<div id="chart-container"></div>
<script>
  // ---- Streamlit 커스텀 컴포넌트 프로토콜 (streamlit-component-lib 없이 직접 구현) ----
  function sendToStreamlit(type, data) {
    var payload = Object.assign({ isStreamlitMessage: true, type: type }, data);
    window.parent.postMessage(payload, "*");
  }
  function notifyReady() {
    sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  }
  function setFrameHeight(height) {
    sendToStreamlit("streamlit:setFrameHeight", { height: height });
  }
  function setComponentValue(value) {
    sendToStreamlit("streamlit:setComponentValue", { value: value });
  }

  // 매 이벤트마다 증가하는 일련번호. 파이썬 쪽은 이 값이 마지막으로 처리한
  // 값과 다를 때만 "새 이벤트"로 취급한다(같은 클릭이 재실행마다 중복 처리되는
  // 것 방지) - 캔들 선택/라인 추가 이벤트 모두 이 하나의 채널로 다중화해서 보낸다.
  var eventSeq = 0;
  function emitEvent(payload) {
    eventSeq += 1;
    setComponentValue(Object.assign({ seq: eventSeq }, payload));
  }

  // ---- 차트 상태. 이 iframe이 재실행 사이에도 유지되는 한 여기 값들도 계속 살아있고,
  // 그래서 줌/이동 상태가 Streamlit 재실행과 무관하게 보존된다. ----
  var chart = null;
  var candleSeries = null;
  var volumeSeries = null;
  var emaSeriesMap = {};  // { "MA9": LineSeries, ... }
  var lastBarTimes = null;
  var currentDrawMode = "select";  // "select" | "horizontal" | "trend"
  var pendingTrendPoint = null;    // 추세선 첫 번째 클릭 대기 중이면 {time, price}
  var priceLineRefs = [];          // 현재 그려진 수평선 참조들
  var trendSeriesMap = {};         // { lineId: LineSeries }
  var firstBarTime = null;
  var lastBarTime = null;

  var DIM_UP = "#a8ddb8";      // 평소(흐림): 상승 캔들
  var DIM_DOWN = "#f2b8b6";    // 평소(흐림): 하락 캔들
  var VIVID_UP = "#26a69a";    // 선택됨(선명): 상승 캔들
  var VIVID_DOWN = "#ef5350";  // 선택됨(선명): 하락 캔들
  var VOL_DIM_UP = "rgba(168, 221, 184, 0.5)";
  var VOL_DIM_DOWN = "rgba(242, 184, 182, 0.5)";
  var VOL_VIVID_UP = "rgba(38, 166, 154, 0.8)";
  var VOL_VIVID_DOWN = "rgba(239, 83, 80, 0.8)";

  function buildCandleData(bars, selectedDate) {
    return bars.map(function (bar) {
      var isUp = bar.close >= bar.open;
      var isSelected = selectedDate !== null && bar.time === selectedDate;
      var color = isSelected ? (isUp ? VIVID_UP : VIVID_DOWN) : (isUp ? DIM_UP : DIM_DOWN);
      return {
        time: bar.time,
        open: bar.open, high: bar.high, low: bar.low, close: bar.close,
        color: color, wickColor: color, borderColor: color,
      };
    });
  }

  function buildVolumeData(bars, selectedDate) {
    return bars.map(function (bar) {
      var isUp = bar.close >= bar.open;
      var isSelected = selectedDate !== null && bar.time === selectedDate;
      var color = isSelected
        ? (isUp ? VOL_VIVID_UP : VOL_VIVID_DOWN)
        : (isUp ? VOL_DIM_UP : VOL_DIM_DOWN);
      return { time: bar.time, value: bar.volume || 0, color: color };
    });
  }

  function ensureChart(height) {
    if (chart) return;
    var container = document.getElementById("chart-container");
    chart = LightweightCharts.createChart(container, {
      width: container.clientWidth,
      height: height,
      layout: { textColor: "#333333", background: { color: "#ffffff" } },
      grid: { vertLines: { color: "#eeeeee" }, horzLines: { color: "#eeeeee" } },
      rightPriceScale: { borderColor: "#cccccc" },
      timeScale: { borderColor: "#cccccc" },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      handleScroll: true,
      handleScale: true,
    });

    candleSeries = chart.addCandlestickSeries({
      upColor: VIVID_UP, downColor: VIVID_DOWN,
      wickUpColor: VIVID_UP, wickDownColor: VIVID_DOWN,
      borderUpColor: VIVID_UP, borderDownColor: VIVID_DOWN,
    });
    // 캔들 가격축은 위쪽 70%만 쓰도록 여백을 줘서, 아래 30%에 거래량이 들어갈
    // 자리를 만든다 (한 차트 안에 두 스케일을 겹쳐 쓰는 lightweight-charts 표준 방식).
    chart.priceScale("right").applyOptions({
      scaleMargins: { top: 0.05, bottom: 0.3 },
    });

    // 거래량 - 캔들과 같은 차트 안, 별도의(보이지 않는) 가격축을 써서 하단에만 그림.
    volumeSeries = chart.addHistogramSeries({
      priceFormat: { type: "volume" },
      priceScaleId: "volume",
    });
    chart.priceScale("volume").applyOptions({
      scaleMargins: { top: 0.75, bottom: 0 },
    });

    // 캔들의 시간축 칸 아무 곳(꼬리 위든 몸통이든)을 클릭해도 그 캔들의 time을 준다 -
    // Plotly 때처럼 별도 히트박스 트릭이 필요 없음(lightweight-charts 기본 동작).
    // 그리기 모드일 때는 같은 클릭을 신호패널용 "선택"이 아니라 선 추가용 좌표로 쓴다.
    chart.subscribeClick(function (param) {
      if (!param || !param.time) return;

      if (currentDrawMode === "select") {
        emitEvent({ kind: "select", date: param.time });
        return;
      }

      var price = param.point ? candleSeries.coordinateToPrice(param.point.y) : null;
      if (price === null || price === undefined) return;

      if (currentDrawMode === "horizontal") {
        emitEvent({ kind: "add_horizontal", price: price });
        return;
      }

      if (currentDrawMode === "trend") {
        if (!pendingTrendPoint) {
          pendingTrendPoint = { time: param.time, price: price };
          candleSeries.setMarkers([{ time: param.time, position: "aboveBar", color: "#ff9800", shape: "circle", text: "1" }]);
        } else {
          emitEvent({
            kind: "add_trend",
            time1: pendingTrendPoint.time, price1: pendingTrendPoint.price,
            time2: param.time, price2: price,
          });
          pendingTrendPoint = null;
          candleSeries.setMarkers([]);
        }
      }
    });

    // 캔들이 있는 시간축 위에서는 포인터 커서, 빈 영역이면 기본 커서.
    chart.subscribeCrosshairMove(function (param) {
      container.style.cursor = (param && param.time) ? "pointer" : "default";
    });

    window.addEventListener("resize", function () {
      chart.applyOptions({ width: container.clientWidth });
    });
  }

  // 파이썬 manual_lines.py의 _trend_line_price와 동일한 선형 보간/외삽 공식.
  // (일 단위 daily 캔들 기준이라 Date 차이를 그대로 비율로 써도 된다)
  function trendPriceAt(time1, price1, time2, price2, targetTime) {
    var t1 = new Date(time1).getTime();
    var t2 = new Date(time2).getTime();
    var t = new Date(targetTime).getTime();
    if (t2 === t1) return price1;
    var frac = (t - t1) / (t2 - t1);
    return price1 + frac * (price2 - price1);
  }

  function renderManualLines(lines) {
    priceLineRefs.forEach(function (pl) { candleSeries.removePriceLine(pl); });
    priceLineRefs = [];
    Object.keys(trendSeriesMap).forEach(function (id) { chart.removeSeries(trendSeriesMap[id]); });
    trendSeriesMap = {};

    (lines || []).forEach(function (line) {
      if (line.line_type === "horizontal") {
        var pl = candleSeries.createPriceLine({
          price: line.price1,
          color: "#1565c0",
          lineWidth: 2,
          lineStyle: LightweightCharts.LineStyle.Dashed,
          axisLabelVisible: true,
          title: line.label || "",
        });
        priceLineRefs.push(pl);
      } else if (line.line_type === "trend" && firstBarTime && lastBarTime) {
        // 등록된 두 점 사이만이 아니라 현재 보이는 데이터 전체 구간으로 연장해서 그림 -
        // 신호 판정(외삽)과 시각적으로 일치시키기 위함.
        var s = chart.addLineSeries({
          color: "#c62828", lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed,
          crosshairMarkerVisible: false, lastValueVisible: false, priceLineVisible: false,
          title: line.label || "추세선",
        });
        s.setData([
          { time: firstBarTime, value: trendPriceAt(line.time1, line.price1, line.time2, line.price2, firstBarTime) },
          { time: lastBarTime, value: trendPriceAt(line.time1, line.price1, line.time2, line.price2, lastBarTime) },
        ]);
        trendSeriesMap[line.id] = s;
      }
    });
  }

  function ensureEmaSeries(emaConfig) {
    Object.keys(emaConfig).forEach(function (key) {
      if (emaSeriesMap[key]) return;
      var cfg = emaConfig[key];
      emaSeriesMap[key] = chart.addLineSeries({
        color: cfg.color,
        lineWidth: 1,
        lineStyle: cfg.dashed ? LightweightCharts.LineStyle.Dashed : LightweightCharts.LineStyle.Solid,
        visible: false,
        crosshairMarkerVisible: false,
        lastValueVisible: false,
        priceLineVisible: false,
        title: key.replace("MA", "EMA"),
      });
    });
  }

  function onRender(args) {
    var bars = args.bars || [];
    var selectedDate = args.selected_date || null;
    var height = args.height || 680;
    var emaConfig = args.ema_series || {};
    var drawMode = args.draw_mode || "select";
    var lines = args.lines || [];

    ensureChart(height);
    ensureEmaSeries(emaConfig);

    // 그리기 모드가 바뀌면(예: 추세선 1클릭 대기 중에 다른 모드로 전환) 대기중이던
    // 임시 상태를 정리한다 - 안 그러면 엉뚱한 시점에 이전 클릭과 짝지어질 수 있음.
    if (drawMode !== currentDrawMode) {
      pendingTrendPoint = null;
      candleSeries.setMarkers([]);
    }
    currentDrawMode = drawMode;

    if (bars.length > 0) {
      firstBarTime = bars[0].time;
      lastBarTime = bars[bars.length - 1].time;
    }

    var barTimes = bars.map(function (b) { return b.time; }).join(",");
    var dataChanged = barTimes !== lastBarTimes;
    lastBarTimes = barTimes;

    candleSeries.setData(buildCandleData(bars, selectedDate));
    volumeSeries.setData(buildVolumeData(bars, selectedDate));
    renderManualLines(lines);

    Object.keys(emaConfig).forEach(function (key) {
      var cfg = emaConfig[key];
      var s = emaSeriesMap[key];
      s.applyOptions({ visible: !!cfg.visible });
      if (cfg.visible) {
        s.setData(cfg.data || []);
      }
    });

    // 데이터 구성 자체가 바뀐 경우(최초 로드, "표시 기간" 변경)에만 전체 보기로
    // 맞추고, 단순히 다른 캔들을 클릭하거나 EMA를 껐다 켜서 selected_date/표시
    // 여부만 바뀐 경우엔 절대 건드리지 않는다 - 이게 줌/이동 상태가 유지되는 핵심.
    if (dataChanged) {
      chart.timeScale().fitContent();
    }

    setFrameHeight(height + 8);
  }

  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "streamlit:render") return;
    onRender(event.data.args || {});
  });

  notifyReady();
</script>
</body>
</html>
