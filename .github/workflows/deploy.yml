# main에 push하면: 백엔드 pytest + 프런트 빌드 -> 둘 다 통과하면 EC2에 배포
#
# 필요한 설정 (deploy/README.md 참고)
#   Secrets  : EC2_HOST, EC2_SSH_KEY, EC2_KNOWN_HOSTS
#   Variables: APP_DIR, VENV_DIR, SERVICE_NAME, FRONTEND_DIR  (선택: EC2_USER=ubuntu, PYTHON_VERSION=3.12, HEALTH_URL)
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 재배포용

# 배포가 겹치지 않게 한 번에 하나씩 (진행 중인 배포는 취소하지 않고 다음 것을 대기시킨다)
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.12' }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      # 고정 데이터(tests/fixtures)만 쓰므로 네트워크/캐시/실제 DB 없이 통과해야 한다
      - run: python -m pytest tests -q

  frontend-build:
    # vitest는 CI에서 돌리지 않는다(SignalScanner.test.tsx가 실제 :8000 백엔드를 호출하므로).
    # npm run build = tsc -b(타입 검사) + vite build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-24.04
    environment: production
    env:
      EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
      APP_DIR: ${{ vars.APP_DIR }}
      VENV_DIR: ${{ vars.VENV_DIR }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      FRONTEND_DIR: ${{ vars.FRONTEND_DIR }}
      HEALTH_URL: ${{ vars.HEALTH_URL || 'http://127.0.0.1:8000/health' }}
    steps:
      - uses: actions/checkout@v5 # deploy/deploy_backend.sh를 쓰기 위해

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: 설정값 확인
        run: |
          missing=0
          for name in APP_DIR VENV_DIR SERVICE_NAME FRONTEND_DIR; do
            if [ -z "${!name}" ]; then echo "::error::Repository variable $name 가 비어 있습니다"; missing=1; fi
          done
          case "$FRONTEND_DIR" in
            /*) ;;
            *) echo "::error::FRONTEND_DIR는 절대 경로여야 합니다"; missing=1 ;;
          esac
          if [ "$FRONTEND_DIR" = "/" ]; then echo "::error::FRONTEND_DIR가 / 입니다"; missing=1; fi
          test -f dist/index.html || { echo "::error::빌드 결과에 index.html이 없습니다"; missing=1; }
          exit $missing

      - name: SSH 준비
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 서버 호스트 키를 미리 고정해 둔다(중간자 공격 방지). 모르는 키면 접속 자체를 거부한다.
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ConnectTimeout 15
          EOF
          ssh prod 'echo "SSH 연결 OK: $(hostname)"'

      # 백엔드 먼저: 실패하면 프런트는 올리지 않는다(새 화면 + 옛 API 조합 방지)
      - name: 백엔드 배포 (git ff + pip + restart + health)
        run: |
          remote_env=$(printf 'APP_DIR=%q VENV_DIR=%q SERVICE_NAME=%q DEPLOY_SHA=%q HEALTH_URL=%q' \
            "$APP_DIR" "$VENV_DIR" "$SERVICE_NAME" "$GITHUB_SHA" "$HEALTH_URL")
          ssh prod "$remote_env bash -s" < deploy/deploy_backend.sh

      - name: 프런트 배포 (dist rsync 덮어쓰기)
        run: |
          # --delete로 엉뚱한 디렉터리를 지우지 않도록, 대상에 기존 index.html이 있는지 먼저 확인
          ssh prod "test -f $(printf %q "$FRONTEND_DIR")/index.html" || {
            echo "::error::$FRONTEND_DIR/index.html 이 서버에 없습니다. FRONTEND_DIR 값을 확인하세요."; exit 1; }
          # 새 assets를 먼저 올리고 index.html을 바꾼 뒤, 옛 파일은 마지막에 지운다(--delete-after)
          rsync -rltz --delete-after --chmod=D755,F644 dist/ "prod:$FRONTEND_DIR/"
          echo "프런트 배포 완료 -> $FRONTEND_DIR"

      - name: SSH 키 정리
        if: always()
        run: rm -f ~/.ssh/deploy_key
